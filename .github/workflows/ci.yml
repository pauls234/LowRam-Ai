name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Byte-compile
        run: python -m compileall -q backend desktop lowram.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        env:
          LOWRAM_HOME: ${{ runner.temp }}/lowram-home
        run: |
          python lowram.py --version
          python lowram.py memory --ram 40 || test $? -eq 3
