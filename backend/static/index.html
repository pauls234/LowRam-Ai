        </ul>
      </nav>

      <section class="history" id="history" aria-labelledby="history-title">
        <h2 class="history-title" id="history-title">Recents</h2>
        <div class="history-body" id="history-body"></div>
      </section>

      <div class="sidebar-foot">
        <svg class="icon" aria-hidden="true"><use href="#i-shield"></use></svg>
        <span>Private · runs on this computer</span>
        <span class="sidebar-version" id="app-version"></span>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon menu-btn" id="menu-btn" type="button" aria-label="Open sidebar" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
        </button>
        <p class="topbar-title" id="topbar-title">LowRAM AI</p>
        <button class="status-pill" id="status-pill" type="button" aria-describedby="status-pill-desc">
          <span class="dot dot-idle" id="status-dot" aria-hidden="true"></span>
          <span class="status-text" id="status-text">Connecting…</span>
          <span class="status-ram" id="status-ram"></span>
        </button>
        <span class="visually-hidden" id="status-pill-desc">Opens Models and Settings</span>
      </header>

      <div class="banners" id="banners" role="region" aria-label="Notifications"></div>

      <main class="views" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <div class="visually-hidden" id="live" aria-live="polite" aria-atomic="true"></div>
